# Build Android automático (equivalente ao Xcode Cloud do iPhone).
#
# Roda a cada push na main que mexa no app, ou manualmente em
# Actions → "Build Android" → Run workflow.
# Gera o APK (instalar direto no celular) e o AAB (Google Play) e deixa os
# dois para download na página da execução. Se o secret
# PLAY_SERVICE_ACCOUNT_JSON existir, também envia o AAB para a faixa de
# teste interno do Google Play.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   conteúdo do key.jks em base64
#   ANDROID_KEYSTORE_PASSWORD senha do keystore (storePassword)
#   ANDROID_KEY_ALIAS         alias da chave (keyAlias)
#   ANDROID_KEY_PASSWORD      senha da chave (keyPassword)
#   GOOGLE_SERVICES_JSON      conteúdo do android/app/google-services.json
# Opcional:
#   PLAY_SERVICE_ACCOUNT_JSON conta de serviço com acesso ao Play Console
# Variáveis opcionais (aba Variables):
#   ANDROID_PLAY_TRACK  faixa do Play: internal (padrão), alpha, beta ou production
#   ANDROID_UPLOAD_SHA1 SHA-1 da chave de upload cadastrada no Play (confere a chave)
#   ANDROID_VERSION_CODE_OFFSET somado ao número da execução para formar o
#   versionCode (use se o Play já tiver um versionCode maior). Padrão: 100.

name: Build Android

on:
  workflow_dispatch:
  # Em PRs só confere o código (flutter analyze + build de teste), sem publicar
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.env'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analisar:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Conferir secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          faltando=""
          [ -n "$KS" ] || faltando="$faltando ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || faltando="$faltando ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || faltando="$faltando ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || faltando="$faltando ANDROID_KEY_PASSWORD"
          [ -n "$GSJ" ] || faltando="$faltando GOOGLE_SERVICES_JSON"
          if [ -n "$faltando" ]; then
            echo "::error::Secrets faltando:$faltando (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Preparar chave de assinatura e Firebase
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$KS" | base64 --decode > android/app/key.jks
          {
            echo "storeFile=key.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
          printf '%s' "$GSJ" > android/app/google-services.json

      - name: Conferir chave de upload do Google Play
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # SHA-1 da "chave de upload" em Play Console → Assinatura de apps
          ESPERADO: ${{ vars.ANDROID_UPLOAD_SHA1 || '' }}
        run: |
          sha1=$(keytool -exportcert -rfc -keystore android/app/key.jks -storepass "$KS_PASS" -alias "$ALIAS" | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)
          echo "SHA-1 da chave usada: $sha1"
          if [ -z "$ESPERADO" ]; then
            echo "::warning::Variável ANDROID_UPLOAD_SHA1 não definida; cadastre o SHA-1 acima para conferir a chave nos próximos builds."
          elif [ "$sha1" != "$ESPERADO" ]; then
            echo "::error::A chave (key.jks) não é a chave de upload cadastrada no Google Play ($ESPERADO). O Play recusaria o envio."
            exit 1
          fi

      - name: Versão
        id: versao
        env:
          OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET || '100' }}
        run: |
          nome=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          codigo=$(( ${{ github.run_number }} + OFFSET ))
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          echo "Versão $nome ($codigo)"

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-name=${{ steps.versao.outputs.nome }} --build-number=${{ steps.versao.outputs.codigo }}

      - name: Build AAB (Google Play)
        run: flutter build appbundle --release --build-name=${{ steps.versao.outputs.nome }} --build-number=${{ steps.versao.outputs.codigo }}

      - name: Renomear arquivos
        run: |
          mkdir -p saida
          cp build/app/outputs/flutter-apk/app-release.apk "saida/embarqueellus-${{ steps.versao.outputs.nome }}-${{ steps.versao.outputs.codigo }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "saida/embarqueellus-${{ steps.versao.outputs.nome }}-${{ steps.versao.outputs.codigo }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: embarqueellus-android-${{ steps.versao.outputs.nome }}-${{ steps.versao.outputs.codigo }}
          path: saida/
          retention-days: 30

      - name: Enviar para o Google Play (teste interno)
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.embarqueellus
          releaseFiles: saida/*.aab
          track: ${{ vars.ANDROID_PLAY_TRACK || 'internal' }}
          status: completed

      - name: Limpar chave
        if: always()
        run: rm -f android/app/key.jks android/key.properties android/app/google-services.json
