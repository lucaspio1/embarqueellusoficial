org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.defaults.namespace=com.amolg.flutterbarcodescanner
# Plugins antigos (ex.: tflite_flutter) compilam Java em 1.8 e Kotlin em 17;
# o Kotlin 2.2 recusa essa diferença. O bytecode 17 é aceito pelo Android (D8).
kotlin.jvm.target.validation.mode=IGNORE
